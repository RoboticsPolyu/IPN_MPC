# MPC discretization and execution.
# Number of optimized control inputs; prediction duration is horizon * dt [s].
horizon: 30
# MPC/control sampling period [s].
dt: 0.01
# Number of closed-loop MPC cycles to simulate.
mpc_iterations: 6000
# Maximum Levenberg-Marquardt iterations per MPC cycle.
optimizer_iterations: 10
# Enable the interactive quadrotor viewer.
visualize: true
# Pace visualized simulation cycles according to dt; ignored in headless mode.
real_time_playback: true
# Exclude these initial cycles from timing statistics.
statistics_warmup_iterations: 5
# Print accumulated timing statistics every N cycles; use 0 to disable periodic reports.
statistics_print_interval: 10
# Quadrotor dynamics configuration, resolved relative to this file.
quadrotor_config: quadrotor_thrust_gyro.yaml

# Low-level attitude controller used to realize the MPC world-acceleration command.
# Proportional gain from attitude error [rad] to desired body rate [rad/s].
attitude_gain: 8.0
# Proportional gain from body-rate error [rad/s] to angular acceleration [rad/s^2].
body_rate_gain: 30.0
# ODE integration steps performed during one MPC sampling period.
simulator_substeps: 20
# Absolute torque limit applied independently to each body axis [N m].
maximum_torque: 1.00

# Initial simulated state in the world frame.
# Position [x, y, z] [m].
initial_position: [1.3, 0.5, 1.5]
# Attitude [roll, pitch, yaw] [rad].
initial_rpy: [0.0, 0.0, 1.57079632679]
# Linear velocity [vx, vy, vz] [m/s]. The speed ramp starts from rest.
initial_velocity: [0.0, 0.0, 0.0]

# Circular reference trajectory.
# Circle center [x, y, z] in the world frame [m].
circle_center: [0.0, 0.0, 1.0]
# Fixed circle radius [m].
circle_radius: 1.0
# Final tangential speed after ramping [m/s]. The final angular speed is speed/radius.
circle_target_speed: 4.0
# Duration of the smooth zero-to-target-speed ramp [s].
speed_ramp_duration: 4.0
# If true, reference yaw follows the trajectory tangent; otherwise yaw remains zero.
face_velocity: true

# Factor noise standard deviations. Smaller values impose stronger soft constraints.
# Shared sigma for the initial pose prior: rotation [rad] and position [m].
initial_pose_sigma: 1.0e-5
# Initial world-velocity prior sigma [m/s].
initial_velocity_sigma: 1.0e-5
# Position tracking sigma used by set-point factors and terminal-weight computation [m].
terminal_position_sigma: 0.20
# Rotation tracking sigma used by set-point factors and terminal-weight computation [rad].
terminal_rotation_sigma: 0.15
# Velocity tracking sigma used by set-point factors and terminal-weight computation [m/s].
terminal_velocity_sigma: 0.15
# Reserved adjacent-state dynamics sigmas; currently unused by the set-point-only graph.
dynamics_position_sigma: 0.005
dynamics_rotation_sigma: 0.005
dynamics_velocity_sigma: 0.01
# Sigma of the prior around trajectory-derived world acceleration [m/s^2].
acceleration_regularization_sigma: 5.0
# Sigma of the prior around trajectory-derived body angular speed [rad/s].
angular_speed_regularization_sigma: 3.0
# Sigma of U(k) - U(k-1), penalizing rapid control changes.
control_smoothness_sigma: 1.0

# Hard bounds for U(k) = [a_world_x, a_world_y, a_world_z,
#                         omega_body_x, omega_body_y, omega_body_z].
# Lower component-wise bounds [m/s^2, m/s^2, m/s^2, rad/s, rad/s, rad/s].
control_min: [-20.0, -20.0, -20.0, -8.0, -8.0, -8.0]
# Upper component-wise bounds in the same units and ordering.
control_max: [ 20.0,  20.0,  20.0,  8.0,  8.0,  8.0]
# Sequential QP refinements used to enforce control bounds each MPC cycle.
hard_control_constraint_iterations: 2

# Test pass thresholds computed over the complete simulation.
# Maximum accepted RMS position error [m].
success_rms_position_tolerance: 0.20
# Maximum accepted RMS SO(3) rotation error [rad].
success_rms_rotation_tolerance: 0.20

# Since terminal weights must be adapted to varying initial conditions, careful parameter tuning becomes a critical aspect of MPC design